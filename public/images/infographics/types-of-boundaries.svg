<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="600"
  viewBox="0 0 800 600"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="typesOfBoundariesTitle typesOfBoundariesDesc"
>
  <title id="typesOfBoundariesTitle">Типы личных границ</title>
  <desc id="typesOfBoundariesDesc">Физические, эмоциональные и интеллектуальные границы — как они помогают беречь ваше тело, чувства и мысли.</desc>
  <style><![CDATA[
    text { font-family: sans-serif; }
  ]]></style>
  <rect width="800" height="600" fill="#111820"/>
  <rect x="40" y="40" width="720" height="520" rx="24" fill="#0B1014" stroke="#7C9A8E" stroke-opacity="0.3" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#E5E7EB">Типы личных границ</text>
  <g id="physical">
    <circle cx="200" cy="280" r="80" fill="#7C9A8E" fill-opacity="0.15" stroke="#7C9A8E" stroke-opacity="0.4" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#7C9A8E">Физические</text>
    <text x="200" y="297" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#E5E7EB" fill-opacity="0.75">Тело, пространство</text>
  </g>
  <g id="emotional">
    <circle cx="400" cy="280" r="80" fill="#6B8DAE" fill-opacity="0.15" stroke="#6B8DAE" stroke-opacity="0.4" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="400" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#6B8DAE">Эмоциональные</text>
    <text x="400" y="297" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#E5E7EB" fill-opacity="0.75">Чувства, границы</text>
  </g>
  <g id="intellectual">
    <circle cx="600" cy="280" r="80" fill="#C4836A" fill-opacity="0.15" stroke="#C4836A" stroke-opacity="0.4" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <text x="600" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#C4836A">Интеллектуальные</text>
    <text x="600" y="297" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#E5E7EB" fill-opacity="0.75">Мысли, убеждения</text>
  </g>
  <text x="400" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#E5E7EB" fill-opacity="0.75">Оба типа границ помогают сохранять баланс и уважение к себе</text>
  <text x="400" y="488" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#E5E7EB" fill-opacity="0.75">и в практике осознанности, и в отношениях с людьми</text>
</svg>
